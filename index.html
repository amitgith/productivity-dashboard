<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Productivity Dashboard</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- <body onload="initClock()"> -->
    <!-- Main -->
    <main>
      <!-- Dashboard Navigation -->
      <nav class="navbar">
        <h1>Productivity Dashboard</h1>
        <div class="dark-mode">
          <span class="day"><i class="ri-sun-fill"></i></span>
          <span class="night"><i class="ri-moon-fill"></i></span>
        </div>
      </nav>
      <section class="section-container">
        <video id="bg-video" autoplay muted loop playsinline>
          <source
            id="video-source"
            src="assets/videos/1.mp4"
            type="video/mp4"
          />
        </video>
        <div class="section-box">
          <div class="timming">
            <div class="timming-date">
              <div>
                <div class="date">
                  <span id="dayname">Day</span>
                  <span id="month">month</span>
                  <span id="daynum">Day</span>
                  <span id="year">Year</span>
                </div>
                <div class="date">
                  <span id="hour">00</span>: <span id="minutes">00</span>:
                  <span id="seconds">00</span>:
                  <span id="period">AM</span>
                </div>
              </div>
            </div>
            <div class="weater">Weather Api</div>
          </div>
          <div class="feat-list">
            <div class="list-box">
              <div class="todo">
                <img
                  src="https://images.unsplash.com/photo-1641261689141-ee46b8a0470c?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                  alt=""
                />
              </div>
              <div class="daily">
                <img
                  src="https://images.unsplash.com/photo-1529651737248-dad5e287768e?q=80&w=765&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                  alt=""
                />
              </div>
              <div class="motivate">
                <img
                  src="https://plus.unsplash.com/premium_photo-1723619021737-df1d775eccc8?q=80&w=1169&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                  alt=""
                />
              </div>
              <div class="timer">
                <img
                  src="https://images.unsplash.com/photo-1664994817539-8a865f12dc6c?q=80&w=765&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                  alt=""
                />
              </div>
              <div class="goal">
                <img
                  src="https://plus.unsplash.com/premium_photo-1705010662254-97e7d82cd182?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                  alt=""
                />
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Your Personalised task list -->
      <div class="task-container">
        <!-- Heading -->
        <div class="task-heading">
          <h1>Your Personalised task List</h1>
          <div class="task-close"><h2>x</h2></div>
        </div>
        <!-- task box -->
        <div class="task-box">
          <div class="form-data">
            <form action="" id="form-container">
              <input type="text" id="task" placeholder="Enter Task" />
              <textarea placeholder="Enter Details" id="details"></textarea>
              <div>
                <input type="checkbox" id="check" />
                Marks as Important!
              </div>
              <button class="task-add" id="adding">Add Task</button>
            </form>
          </div>
          <div class="todo-list"></div>
        </div>
      </div>

      <!-- Daily Planner Modal -->
      <div class="daily-planner">
        <div class="daily-planner__header">
          <h1 class="daily-planner__title">
            Plan Your Day to Be More Productive
          </h1>

          <button class="daily-planner__close">&times;</button>
        </div>

        <div class="daily-planner__container">
          <div class="daily-planner__grid">
            <div class="daily-planner__column">
              <div class="time-slot">
                <label>6:00 - 7:00</label>
                <input type="text" placeholder="....." />
              </div>

              <div class="time-slot">
                <label>8:00 - 9:00</label>
                <input type="text" placeholder="....." />
              </div>

              <div class="time-slot">
                <label>10:00 - 11:00</label>
                <input type="text" placeholder="....." />
              </div>

              <div class="time-slot">
                <label>12:00 - 13:00</label>
                <input type="text" placeholder="....." />
              </div>

              <div class="time-slot">
                <label>14:00 - 15:00</label>
                <input type="text" placeholder="....." />
              </div>

              <div class="time-slot">
                <label>16:00 - 17:00</label>
                <input type="text" placeholder="....." />
              </div>

              <div class="time-slot">
                <label>18:00 - 19:00</label>
                <input type="text" placeholder="....." />
              </div>

              <div class="time-slot">
                <label>20:00 - 21:00</label>
                <input type="text" placeholder="....." />
              </div>

              <div class="time-slot">
                <label>22:00 - 23:00</label>
                <input type="text" placeholder="....." />
              </div>
            </div>

            <div class="daily-planner__column">
              <div class="time-slot">
                <label>7:00 - 8:00</label>
                <input type="text" placeholder="....." />
              </div>

              <div class="time-slot">
                <label>9:00 - 10:00</label>
                <input type="text" placeholder="....." />
              </div>

              <div class="time-slot">
                <label>11:00 - 12:00</label>
                <input type="text" placeholder="....." />
              </div>

              <div class="time-slot">
                <label>13:00 - 14:00</label>
                <input type="text" placeholder="....." />
              </div>

              <div class="time-slot">
                <label>15:00 - 16:00</label>
                <input type="text" placeholder="....." />
              </div>

              <div class="time-slot">
                <label>17:00 - 18:00</label>
                <input type="text" placeholder="....." />
              </div>

              <div class="time-slot">
                <label>19:00 - 20:00</label>
                <input type="text" placeholder="....." />
              </div>

              <div class="time-slot">
                <label>21:00 - 22:00</label>
                <input type="text" placeholder="....." />
              </div>

              <div class="time-slot">
                <label>23:00 - 24:00</label>
                <input type="text" placeholder="....." />
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Motivational Quotes Modal -->
      <div class="quotes-modal">
        <button class="quotes-modal__close">&times;</button>

        <div class="quotes-modal__container">
          <div class="quotes-card">
            <h2 class="quotes-card__title">Quote of the Day</h2>

            <div class="quotes-card__content">
              <blockquote class="quotes-card__quote" id="quote">
                God is always with me.
              </blockquote>

              <cite class="quotes-card__author" id="author">
                — Amit Kumar Sharma
              </cite>
            </div>
          </div>
        </div>
      </div>

      <!-- ==========================
     Study With Me Modal
=========================== -->

      <div class="study-modal">
        <div class="study-modal__header">
          <h1 class="study-modal__title">Study With Me</h1>

          <button class="study-modal__close">&times;</button>
        </div>

        <div class="study-modal__body">
          <div class="study-card">
            <h2 class="study-card__heading">Work Session</h2>

            <div class="study-card__timer" id="timer">25:00</div>

            <div class="study-card__controls">
              <button
                class="study-card__btn study-card__btn--start"
                id="startBtn"
              >
                Start
              </button>

              <button
                class="study-card__btn study-card__btn--pause"
                id="pauseBtn"
              >
                Pause
              </button>

              <button
                class="study-card__btn study-card__btn--reset"
                id="resetBtn"
              >
                Reset
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Your Daily Goal list -->
      <div class="goal-container">
        <!-- Heading -->
        <div class="goal-heading">
          <h1>Daily Goals</h1>
          <div class="goal-close"><h2>x</h2></div>
        </div>
        <!-- task box -->
        <div class="goal-box">
          <div class="goal-data">
            <form action="" id="form-goal-container">
              <input type="text" id="goal" placeholder="Enter goals" />
              <textarea
                placeholder="Enter your Goals"
                id="detailsgoal"
              ></textarea>
              <button class="goal-add" id="adding">All Goals</button>
            </form>
          </div>
          <div class="goal-list"></div>
        </div>
      </div>
    </main>
    <script src="script.js"></script>
    <sup></sup>
  </body>
</html>
